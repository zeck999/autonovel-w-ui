<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autonovel — Autonomous Fiction Creator</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div id="app">
    <header class="app-header">
        <a href="#/dashboard" class="brand">
            <h1>Autonovel</h1>
            <span>Autonomous Fiction Harness</span>
        </a>

        <nav class="main-nav">
            <a href="#/dashboard">Dashboard</a>
            <a href="#/projects">Projets</a>
            <a href="#/universes">Univers</a>
            <a href="#/files" class="nav-item" data-route="files">Fichiers & Lore</a>
            <a href="#/branches">Versions / Branches</a>
            <a href="#/settings">Paramètres</a>
            <a href="#/pipeline">Pipeline</a>
        </nav>

        <div class="header-actions">
            <button class="hamburger-btn" id="hamburger-toggle" aria-label="Toggle navigation menu">
                <span></span>
                <span></span>
                <span></span>
            </button>
            <button class="btn btn-sm" id="current-review-btn" title="Current review status">
                <span class="review-icon">★</span> <span class="review-text">Revue</span>
            </button>
            <div id="connection-badge" class="connection-badge online">Connecté</div>
            <button class="btn btn-sm" id="inspector-toggle">Inspection</button>
        </div>
    </header>

    <main class="content-container" id="app-content">
        <!-- Dynamic Views Loaded Here -->
    </main>

    <!-- Inspector Drawer -->
    <div id="inspector-drawer" class="inspector-drawer">
        <div class="inspector-header">
            <div class="inspector-title">
                <span>Volet d'Inspection & Logs</span>
                <span id="inspector-status-dot">●</span>
            </div>
            <button class="btn btn-sm" id="inspector-close">Fermer</button>
        </div>
        <div class="inspector-body">
            <div id="inspector-meta" style="margin-bottom: 1rem; border-bottom: 1px solid #2a2820; padding-bottom: 0.75rem;">
                <!-- Metadata loaded here -->
            </div>
            <div id="inspector-logs">
                <!-- Logs loaded here -->
            </div>
        </div>
    </div>

    <!-- Review Details Modal -->
    <div id="review-modal" class="modal-overlay">
        <div class="modal-container card">
            <div class="modal-header">
                <h3 class="card-title" style="margin-bottom:0;">Revue Actuelle du Manuscrit</h3>
                <button class="btn btn-sm" id="review-modal-close">Fermer</button>
            </div>
            <div class="modal-body" id="review-modal-body">
                <!-- Loaded dynamically -->
            </div>
        </div>
    </div>
</div>

<script type="module">
    import { store } from './js/store.js';
    import { initRouter } from './js/router.js';
    import { initInspector } from './js/inspector.js';
    import { initReviews } from './js/reviews.js';

    window.addEventListener('DOMContentLoaded', async () => {
        initRouter();
        initInspector();
        initReviews();
        await store.init();

        // Update connection status badge
        store.subscribe(state => {
            const badge = document.getElementById('connection-badge');
            if (badge) {
                if (state.isOnline) {
                    badge.className = 'connection-badge online';
                    badge.textContent = 'Connecté';
                } else {
                    badge.className = 'connection-badge offline';
                    badge.textContent = 'Hors connexion';
                }
            }
        });
    });
</script>

</body>
</html>
